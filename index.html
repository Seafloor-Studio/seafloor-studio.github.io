<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seafloor Studio</title>
<meta name="description" content="Small, calm software built at the bottom of the stack. Seafloor Studio makes Android apps that do one thing well and stay out of your way.">
<meta name="theme-color" content="#072A32">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23072A32'/%3E%3Ccircle cx='32' cy='14' r='4' fill='%235FBFAE'/%3E%3Cg fill='none' stroke='%23F2EFE6' stroke-width='5.5' stroke-linecap='round'%3E%3Cpath d='M10 24 Q 32 40 54 24'/%3E%3Cpath d='M10 33 Q 32 48 54 33'/%3E%3Cpath d='M10 42 Q 32 56 54 42'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600&display=swap">
<style>
  :root { --sea: #072A32; --deep: #0F3D48; --rule: #1C4650; --sand: #F2EFE6; --mist: #A9BFC2; --kelp: #5FBFAE; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sea); color: var(--sand);
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px; line-height: 1.6;
    display: flex; flex-direction: column; min-height: 100vh;
    position: relative; overflow-x: hidden;
  }
  .contours { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 46vh; z-index: 0; pointer-events: none; }
  main, footer { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 24px; }
  main { flex: 1; padding-top: 14vh; padding-bottom: 64px; }
  .mark { display: block; width: 88px; height: 88px; margin-bottom: 36px; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 700;
    font-size: clamp(48px, 9vw, 84px); line-height: 0.95; letter-spacing: -0.02em;
    margin: 0 0 28px;
  }
  h1 span { color: var(--kelp); display: block; }
  .lede { font-size: clamp(19px, 2.4vw, 22px); max-width: 34em; margin: 0 0 48px; color: var(--sand); }
  .soon { border-top: 1px solid var(--rule); padding-top: 24px; max-width: 34em; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist); margin: 0 0 8px; }
  .soon p { margin: 0; color: var(--mist); }
  a { color: var(--kelp); text-underline-offset: 3px; }
  a:hover { color: var(--sand); }
  footer { padding-top: 24px; padding-bottom: 32px; font-size: 15px; color: var(--mist); display: flex; flex-wrap: wrap; gap: 8px 24px; }
</style>
</head>
<body>
<svg class="contours" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke="#0F3D48" stroke-width="14" stroke-linecap="round">
    <path d="M-80 170 Q 520 330 1100 170"></path>
    <path d="M-80 250 Q 520 410 1100 250"></path>
    <path d="M560 120 Q 1100 300 1560 120"></path>
    <path d="M560 210 Q 1100 390 1560 210"></path>
    <path d="M560 300 Q 1100 470 1560 300"></path>
  </g>
</svg>

<main>
  <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Seafloor Studio mark">
    <circle cx="32" cy="9" r="4.5" fill="#5FBFAE"></circle>
    <g fill="none" stroke="#F2EFE6" stroke-width="6.5" stroke-linecap="round">
      <path d="M4 20 Q 32 40 60 20"></path>
      <path d="M4 30 Q 32 49 60 30"></path>
      <path d="M4 40 Q 32 57 60 40"></path>
    </g>
  </svg>
  <h1>Seafloor <span>Studio</span></h1>
  <p class="lede">Small, calm software built at the bottom of the stack. Seafloor Studio makes Android apps that do one thing well and stay out of your way.</p>
  <section class="soon" aria-labelledby="soon-label">
    <p class="label" id="soon-label">Journal</p>
    <p>Notes from the studio are on their way. Check back soon.</p>
  </section>
</main>

<footer>
  <a href="mailto:seafloor-studio-support@googlegroups.com">seafloor-studio-support@googlegroups.com</a>
  <a href="https://github.com/Seafloor-Studio">GitHub</a>
</footer>
</body>
</html>
